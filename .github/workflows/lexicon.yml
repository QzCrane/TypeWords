name: Lexicon integrity

on:
  pull_request:
    paths:
      - 'apps/nuxt/app/pages/lexicon/**'
      - 'apps/nuxt/app/pages/(words)/dict-list.vue'
      - 'apps/nuxt/public/typewords_lexicon_v2/**'
      - 'packages/core/src/lexicon/**'
      - 'packages/core/src/types/types.ts'
      - 'packages/core/src/stores/base.ts'
      - 'packages/core/src/hooks/dict.ts'
      - 'packages/core/src/composables/usePracticePersistence.ts'
      - 'packages/core/src/utils/cache.ts'
      - 'packages/core/src/config/env.ts'
      - 'scripts/build-lexicon-runtime.mjs'
      - 'scripts/validate-lexicon.mjs'
      - 'scripts/card-state.test.mjs'
      - 'package.json'
      - 'apps/nuxt/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/lexicon.yml'
  push:
    branches:
      - master
    paths:
      - 'apps/nuxt/app/pages/lexicon/**'
      - 'apps/nuxt/app/pages/(words)/dict-list.vue'
      - 'apps/nuxt/public/typewords_lexicon_v2/**'
      - 'packages/core/src/lexicon/**'
      - 'packages/core/src/types/types.ts'
      - 'packages/core/src/stores/base.ts'
      - 'packages/core/src/hooks/dict.ts'
      - 'packages/core/src/composables/usePracticePersistence.ts'
      - 'packages/core/src/utils/cache.ts'
      - 'packages/core/src/config/env.ts'
      - 'scripts/build-lexicon-runtime.mjs'
      - 'scripts/validate-lexicon.mjs'
      - 'scripts/card-state.test.mjs'
      - 'package.json'
      - 'apps/nuxt/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/lexicon.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lexicon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and validate lexicon runtime
        run: pnpm lexicon:check

      - name: Run card migration fixtures
        run: pnpm test:lexicon-cards

      - name: Build Nuxt application
        shell: bash
        run: |
          set -o pipefail
          pnpm -F @typewords/nuxt build 2>&1 | tee nuxt-build.log

      - name: Upload failed Nuxt build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lexicon-nuxt-build-log
          path: nuxt-build.log
          if-no-files-found: ignore
          retention-days: 7
